[pytest]
# Конфигурация pytest для e2e тестов

asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Маркеры
markers =
    asyncio: async тесты
    e2e: end-to-end тесты через Telethon
    slow: медленные тесты

# Вывод
addopts = -v --tb=short

# Таймауты
timeout = 60
